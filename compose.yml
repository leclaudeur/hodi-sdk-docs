# The Portainer stack: the image built by the CI. SDK_DOCS_PORT picks the server's port (8080 when unset).
# Behind the reverse proxy, point sdk.<domain> at this port.
services:
  sdk-docs:
    image: ghcr.io/leclaudeur/hodi-sdk-docs:latest
    restart: unless-stopped
    ports:
      - '${SDK_DOCS_PORT:-8080}:80'
