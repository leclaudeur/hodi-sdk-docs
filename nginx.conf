# The documentation is static files: Astro wrote one folder per page, each with its index.html.

# A browser that lists French among its languages lands on the French pages, any other on the English ones.
map $http_accept_language $sdk_lang {
  ~*(^|,)\s*fr fr;
  default en;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Behind the reverse proxy: a redirect such as /fr to /fr/ keeps the visitor's own host and port.
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
  gzip_min_length 1024;

  # The root, /fr/, /en/ and the guides' folders: 301s to their first page, written by the build.
  include /etc/nginx/redirects.conf;

  # Each location repeats the security headers: nginx drops the outer ones where a location adds its own.
  # Files whose name carries their hash never change: a year in the cache.
  location ~ ^/(_astro|assets)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
  }

  # Pages change with each deploy: the browser asks again, and gets 304 when nothing moved.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri $uri/ =404;
  }

  # An unknown English address gets the English page.
  location /en/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri $uri/ =404;
    error_page 404 /en/404/index.html;
  }

  error_page 404 /404.html;
}
